name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC 校验所有下载链接
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: python3 -m json.tool data/catalog.json > /dev/null && echo "catalog OK"

      - name: Build static JSON API
        run: python3 scripts/build_api.py

      - name: Show summary
        run: |
          python3 - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("public/api/systems.json").read_text())
          print("verified:", d["meta"]["verified_at"])
          for s in d["systems"]:
              print(f"  {s['id']:<8} {s['available_count']}/{s['version_count']}  versions available")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
