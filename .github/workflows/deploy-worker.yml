name: Deploy Worker

# 把 worker/ 目录部署到 Cloudflare Workers。
# 需要仓库 Secrets： CF_API_TOKEN（Workers 编辑权限）、CF_ACCOUNT_ID
# 未配置时自动跳过，不会失败。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::CF_API_TOKEN / CF_ACCOUNT_ID 未配置，跳过 Worker 部署"
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check worker/src/index.js

      - name: Install wrangler
        if: steps.cfg.outputs.ready == 'true'
        run: npm i -g wrangler@3

      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: wrangler deploy
